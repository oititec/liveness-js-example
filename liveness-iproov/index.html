<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liveness JS - Liveness 3D Iproov</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
 
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="icon" href="/assets/favicon.ico" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"
    integrity="sha512-E8QSvWZ0eCLGk4km3hxSsNmGWbLtSCSUcewDQPQWZF6pEU8GlT8a5fF32wOl1i8ftdMhssTrF/OhyGWwonTcXA=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="/assets/js/iproov/web-sdk/iProovMe.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>

<body>
  <div class="container-fluir p-0">
    <div data-component></div>
    <div class="container">
      <div class="row">
        <div class="col-12 mt-4">
          <a href="/home/index.html">Voltar</a>
        </div>
        <div class="col-12 my-4">
          <div class="wrapping-box-container">
            <div id="controls" class="controls">


              <button id="liveness-button" class="btn btn-primary btn-rounded" disabled = "isLoading"
              aria-label="Iniciar a validação facial 3D com a câmera">
                Iniciar Validacao Iproov</button>

              <p id="status" class="mt-2" aria-live="assertive"></p>
              <h3 id="statusRequest" className="mt-2" aria-live="polite"></h3>

              <div class="grid gap-5 w-full px-10">
                <ul id="userFeedback" class="pull-left list-disc pl-5"></ul>
              </div>

              <div id="certiface-iproov"></div>

              <hr />
              <div id="custom-logo-container">
                <img src="../assets/img/Iproov_Logo.png" alt="Logotipo da solução de validação facial da Iproov"" />
              </div>
            </div>
          </div>
        </div>
        <div class="col-12 text-center">
          <button id="btn-delete-app-key" type="button" class="btn btn-link" 
            aria-label="Clique aqui se estiver com problemas. Isso removerá sua AppKey.">
            Em caso de problemas, clique aqui
          </button>
        </div>
      </div>
    </div>
  </div>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js" 
crossorigin="anonymous"></script>
<script src="/assets/js/env.js"></script>
<script src="/Config.js"></script>
<script src="/assets/js/liveness-iproov/liveness-iproov.js"></script>
<script src="/assets/js/facecaptcha/facecaptcha.service.js"></script>
<script src="/assets/js/header/header.js"></script>
<script src="/assets/js/header/header-loader.js"></script>

</html>
