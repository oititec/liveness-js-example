<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liveness JS - AppKey</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <link rel="stylesheet" href="/assets/css/appkey.css">
  <link rel="stylesheet" href="/assets/css/misc.css">
  <link rel="icon" href="/assets/favicon.ico" />
</head>

<body>
  <div data-component></div>
  <div class="container">
    <div class="container-fluid content-screen">
      <div class="row g-0 h-100">

        <div class="col-md-6 d-flex justify-content-center">
          <div class="content-area">

            <h1 class="h1-title"><strong>CertiFace Sample Web</strong></h1>

            <p class="sub-title">
              Agora gere uma AppKey informando seus dados.
            </p>

            <div class="mb-3">
              <span id="status" style="color:red;font-weight:bold"></span>
            </div>

            <div class="mb-3">
              <label><strong>CPF</strong></label>
              <input id="cpf" class="form-control" placeholder="Informe o CPF">
            </div>

            <div class="mb-3">
              <label><strong>Nome</strong></label>
              <input id="nome" class="form-control" placeholder="Informe o nome">
            </div>

            <div class="mb-3">
              <label><strong>Data de nascimento</strong></label>
              <input id="nascimento" class="form-control" placeholder="Informe a data de nascimento">
            </div>

            <button id="btnGerar" class="btn btn-success btn-rounded me-4 w-100">
              <strong>Gerar AppKey</strong>
            </button>

          </div>
        </div>

        <div class="col-md-6 d-none d-md-flex pt-3 ps-0 pe-0 pb-0">
          <img src="/assets/img/img-certiface-dados.jpg" alt="Login" class="img-login">
        </div>

      </div>
    </div>
  </div>
</body>

<script src="/assets/js/env.js"></script>
<script src="/assets/js/appkey/appkey.js"></script>
<script src="/assets/js/facecaptcha/facecaptcha.service.js"></script>
<script src="/assets/js/header/header.js"></script>
<script src="/assets/js/header/header-loader.js"></script>

</html>
